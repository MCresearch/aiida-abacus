[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# See https://www.python.org/dev/peps/pep-0621/
name = "aiida-abacus"
dynamic = ["version"]  # read from aiida_abacus/src/__init__.py
description = "AiiDA plugin for ABACUS"
authors = [{name = "aiida-abacus team"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Framework :: AiiDA"
]
keywords = ["aiida", "plugin"]
requires-python = ">=3.10"
dependencies = [
    "aiida-core>=2.5,<3",
    "aiida-pseudo~=1.7.2",
    "voluptuous",
    "ase",
    "pydantic",
    "tqdm",
    "click-spinner",
    "tabulate"
]

[project.optional-dependencies]
pre-commit = [
  'pre-commit~=3.5',
]
docs = [
    "sphinx~=6.2.1",
    "sphinxcontrib-contentui",
    "sphinxemoji",
    "furo",
    "markupsafe>=2.1.1",
    'sphinx-copybutton~=0.5.2',
    'sphinx-book-theme~=1.0.1',
    'sphinx-click~=4.4.0',
    'sphinx-design~=0.6.1',
    'sphinxcontrib-details-directive~=0.1.0',
    'sphinx-autoapi~=3.0.0',
    'myst-parser~=3.0.0',
]
tutorial = [
    "pymatgen",
    "ase-weas-widget",
    "aiida-vasp",
    "sumo",
]
dev = [
    "ruff"
]

[dependency-groups]
testing = [
    "pgtest~=1.3,>=1.3.1",
    "coverage~=7.0",
    "pytest~=7.0",
    "pytest-cov~=4.1",
    "ipdb",
]
linting = [
    "ruff",
]
docs-build = [
    "sphinx~=6.2.1",
    "sphinxcontrib-contentui",
    "sphinxemoji",
    "furo",
    "markupsafe>=2.1.1",
    "sphinx-copybutton~=0.5.2",
    "sphinx-book-theme~=1.0.1",
    "sphinx-click~=4.4.0",
    "sphinx-design~=0.6.1",
    "sphinxcontrib-details-directive~=0.1.0",
    "sphinx-autoapi~=3.0.0",
    "myst-parser~=3.0.0",
]
dev-tools = [
    {include-group = "testing"},
    {include-group = "linting"},
    "pre-commit~=3.5",
]

[project.urls]
Source = "https://github.com/MCresearch/aiida-abacus"

[project.entry-points."aiida.data"]
"abacus.orbital" = "aiida_abacus.data.orbital:AtomicOrbitalData"

[project.entry-points."aiida.groups"]
"abacus.orbital_collection" = "aiida_abacus.group.orb_group:AtomicOrbitalCollection"
"abacus.orbital_family" = "aiida_abacus.group.orb_group:AtomicOrbitalFamily"

[project.entry-points."aiida.calculations"]
"abacus.abacus" = "aiida_abacus.calculations:AbacusCalculation"

[project.entry-points."aiida.workflows"]
"abacus.base" = "aiida_abacus.workflows.base:AbacusBaseWorkChain"
"abacus.relax" = "aiida_abacus.workflows.relax:AbacusRelaxWorkChain"
"abacus.band" = "aiida_abacus.workflows.band:AbacusBandWorkChain"

[project.entry-points."aiida.parsers"]
"abacus.abacus" = "aiida_abacus.parsers:AbacusParser"

[project.entry-points."aiida.cmdline.data"]
"abacus" = "aiida_abacus.cli:data_cli"

[project.scripts]
"aiida-abacus" = "aiida_abacus.commands:cmd_aiida_abacus"

[tool.pytest.ini_options]
# Configuration for [pytest](https://docs.pytest.org)
python_files = "test_*.py example_*.py"
addopts = "--pdbcls=IPython.terminal.debugger:TerminalPdb"
filterwarnings = [
    "ignore::DeprecationWarning:aiida:",
    "ignore:Creating AiiDA configuration folder:",
    "ignore::DeprecationWarning:plumpy:",
    "ignore::DeprecationWarning:yaml:",
]


[tool.coverage.run]
# Configuration of [coverage.py](https://coverage.readthedocs.io)
# reporting which lines of your plugin are covered by tests
source = ["src/aiida_abacus"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  'F403',  # Star imports unable to detect undefined names
  'F405',  # Import may be undefined or defined from star imports
  'PLR0911',  # Too many return statements
  'PLR0912',  # Too many branches
  'PLR0913',  # Too many arguments in function definition
  'PLR0915',  # Too many statements
  'PLR2004',  # Magic value used in comparison
  'RUF005',  # Consider iterable unpacking instead of concatenation
  'RUF012'  # Mutable class attributes should be annotated with `typing.ClassVar`
]
select = [
  'E',  # pydocstyle
  'W',  # pydocstyle
  'F',  # pyflakes
  'I',  # isort
  'N',  # pep8-naming
  'PLC',  # pylint-convention
  'PLE',  # pylint-error
  'PLR',  # pylint-refactor
  'PLW',  # pylint-warning
  'RUF',  # ruff
  'Q',    # flake8-quotes
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.setuptools.dynamic]
version = {attr = "aiida_abacus.__version__"}

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiida_abacus = [
    "protocols/*.yaml",
    "protocols/presets/*.yaml",
]
